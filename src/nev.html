<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qishloqdan Zamonaviy Poytaxtgacha</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --gold:#f3c653; --cream:#f9f5e8; --night:#050811; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:2200vh; background:var(--night); color:var(--cream); font-family:'Manrope',sans-serif; overflow-x:hidden; }
#canvas-container { position:fixed; inset:0; z-index:1; }
canvas { display:block; width:100vw; height:100vh; }
.ui-layer { position:fixed; inset:0; z-index:2; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; padding:40px 60px; }
header { display:flex; justify-content:space-between; align-items:center; pointer-events:auto; }
.logo { font-family:'Cinzel',serif; font-size:26px; font-weight:800; color:var(--gold); letter-spacing:.15em; text-transform:uppercase; }
nav { display:flex; gap:40px; font-size:13px; font-weight:500; letter-spacing:.2em; text-transform:uppercase; }
nav a { color:var(--cream); text-decoration:none; transition:color .3s; }
nav a:hover { color:var(--gold); }
.hero { position:absolute; top:48%; left:50%; transform:translate(-50%,-50%); text-align:center; pointer-events:auto; transition:opacity .6s ease; width:90%; }
.hero h1 { font-family:'Cinzel',serif; font-size:clamp(38px,6vw,80px); font-weight:800; line-height:1.1; letter-spacing:-.02em; margin-bottom:20px; text-shadow:0 10px 40px rgba(0,0,0,.9); }
.hero p { font-size:17px; color:#d1c8b0; max-width:600px; margin:0 auto; line-height:1.6; }
.end { position:absolute; bottom:14%; left:50%; transform:translateX(-50%); width:90%; text-align:center; font-family:'Cinzel',serif; font-size:clamp(24px,4vw,52px); font-weight:800; color:var(--gold); text-shadow:0 6px 30px rgba(0,0,0,.9); opacity:0; }
.season { position:absolute; left:60px; bottom:40px; font-family:'Cinzel',serif; font-size:22px; letter-spacing:.3em; text-transform:uppercase; color:var(--gold); text-shadow:0 4px 18px rgba(0,0,0,.8); }
.pop { animation:pop 1.2s ease; }
@keyframes pop { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none} }
.scroll-indicator { position:absolute; bottom:40px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:12px; font-size:11px; letter-spacing:.25em; text-transform:uppercase; color:var(--gold); }
.scroll-bar { width:1px; height:50px; background:linear-gradient(to bottom,var(--gold),transparent); animation:scrollAnim 2s infinite; }
@keyframes scrollAnim { 0%{transform:scaleY(0);transform-origin:top} 50%{transform:scaleY(1);transform-origin:top} 50.1%{transform:scaleY(1);transform-origin:bottom} 100%{transform:scaleY(0);transform-origin:bottom} }
@media (max-width:768px){ .ui-layer{padding:20px} nav{display:none} .season{left:20px} }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div class="ui-layer">
  <div class="hero" id="hero">
    <h1>Qishloqdan Zamonaviy Poytaxtgacha</h1>
  </div>
  <div class="end" id="end">Yangi yil bilan!</div>
  <div class="scroll-indicator"><span>Sayohat uchun pastga suring</span><div class="scroll-bar"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.5, 4000);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
container.appendChild(renderer.domElement);
const clamp = (v,a=0,b=1) => Math.min(b, Math.max(a, v));
const EYE = 3;

// ---------- Yorug'lik ----------
const ambient = new THREE.AmbientLight(0x2a3550, 1.0); scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffeedd, 0.4); dirLight.position.set(40,80,30); scene.add(dirLight);
const camLight = new THREE.PointLight(0xffc477, 1.5, 45); scene.add(camLight);
const ambNight = new THREE.Color(0x2a3550), ambDay = new THREE.Color(0xffffff);
const sunNight = new THREE.Color(0x8899cc), sunDay = new THREE.Color(0xfff2dd);

// ---------- Osmon ----------
function glowTexture(draw) { const c = document.createElement('canvas'); c.width = c.height = 256; draw(c.getContext('2d')); return new THREE.CanvasTexture(c); }
const moonTex = glowTexture(g => {
  let r = g.createRadialGradient(128,128,40,128,128,128);
  r.addColorStop(0,'rgba(200,220,255,.55)'); r.addColorStop(1,'rgba(200,220,255,0)');
  g.fillStyle = r; g.fillRect(0,0,256,256);
  g.beginPath(); g.arc(128,128,62,0,7); g.fillStyle = '#eef2f8'; g.fill();
  g.fillStyle = 'rgba(150,160,180,.35)';
  [[108,108,12],[148,122,9],[120,152,14],[150,92,6]].forEach(([x,y,r]) => { g.beginPath(); g.arc(x,y,r,0,7); g.fill(); });
});
const sunTex = glowTexture(g => {
  let r = g.createRadialGradient(128,128,0,128,128,128);
  r.addColorStop(0,'rgba(255,255,235,1)'); r.addColorStop(.28,'rgba(255,236,150,1)');
  r.addColorStop(.34,'rgba(255,200,90,.55)'); r.addColorStop(1,'rgba(255,150,40,0)');
  g.fillStyle = r; g.fillRect(0,0,256,256);
});
const shafaqTex = glowTexture(g => {
  let r = g.createLinearGradient(0,0,0,256);
  r.addColorStop(0,'rgba(255,90,30,0)'); r.addColorStop(.6,'rgba(255,120,40,.8)'); r.addColorStop(1,'rgba(255,200,100,1)');
  g.fillStyle = r; g.fillRect(0,0,256,256);
});
const skyMat = t => new THREE.SpriteMaterial({ map:t, transparent:true, fog:false, depthWrite:false });
const moon = new THREE.Sprite(skyMat(moonTex)); moon.scale.set(220,220,1); scene.add(moon);
const sun  = new THREE.Sprite(skyMat(sunTex));  sun.scale.set(420,420,1);  scene.add(sun);
const shafaq = new THREE.Mesh(new THREE.PlaneGeometry(3600,700),
  new THREE.MeshBasicMaterial({ map:shafaqTex, transparent:true, opacity:0, fog:false, depthWrite:false, blending:THREE.AdditiveBlending }));
scene.add(shafaq);
const starPos = new Float32Array(1200*3);
for (let i=0;i<1200;i++){
  const a = Math.random()*Math.PI*2, e = Math.random()*1.25 + 0.05, R = 1800;
  starPos[i*3] = Math.cos(a)*Math.cos(e)*R; starPos[i*3+1] = Math.sin(e)*R*0.7; starPos[i*3+2] = Math.sin(a)*Math.cos(e)*R;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color:0xffffff, size:2, sizeAttenuation:false, transparent:true, fog:false }));
scene.add(stars);
const cloudGroup = new THREE.Group(); scene.add(cloudGroup);
const cloudMat = new THREE.MeshLambertMaterial({ color:0xffeedd, transparent:true, opacity:0 });
for (let i=0;i<25;i++) cloudGroup.add(new THREE.Mesh(new THREE.BoxGeometry(44,7,18), cloudMat));

// ---------- Yo'l ----------
const curve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0,EYE,0), new THREE.Vector3(0,EYE,-120), new THREE.Vector3(25,EYE,-300),
  new THREE.Vector3(-25,EYE,-500), new THREE.Vector3(0,EYE,-750), new THREE.Vector3(0,EYE,-1000),
  new THREE.Vector3(0,EYE,-1250), new THREE.Vector3(0,EYE,-1400)
]);
curve.arcLengthDivisions = 1000;
function flatTangent(u){ const t = curve.getTangentAt(u); t.y = 0; return t.normalize(); }

// ---------- Materiallar ----------
function wallTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'); g.fillStyle = '#8c6239'; g.fillRect(0,0,256,256);
  g.strokeStyle = '#5a3d22'; g.lineWidth = 3;
  for (let i=0;i<=256;i+=32){ g.beginPath(); g.moveTo(0,i); g.lineTo(256,i); g.stroke(); g.beginPath(); g.moveTo(i,0); g.lineTo(i,256); g.stroke(); }
  return new THREE.CanvasTexture(c);
}
const M = (o) => new THREE.MeshStandardMaterial(o);
const villageMat = M({ map:wallTexture(), roughness:.9 }), shopMat = M({ color:0xc27803, roughness:.5 });
const tentMat = M({ color:0xd90429, roughness:.4 }), roofMat = M({ color:0x4a3525, roughness:.8 });
const trunkMat = M({ color:0x5c4033, roughness:.9 }), concreteMat = M({ color:0xe0e0e0, roughness:.4 }), poleMat = M({ color:0x333333 });
const bulbMat = new THREE.MeshBasicMaterial({ color:0xffcc77 });

function ribbon(a, b, y, mat, dash){
  const N = 600, pos = [], idx = [];
  for (let i=0;i<=N;i++){
    const u = i/N, p = curve.getPointAt(u), t = flatTangent(u), rx = -t.z, rz = t.x;
    pos.push(p.x+rx*a, y, p.z+rz*a,  p.x+rx*b, y, p.z+rz*b);
    if (i<N && !(dash && Math.floor(i/dash)%2)) { const k=i*2; idx.push(k,k+1,k+3, k,k+3,k+2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat); scene.add(m); return m;
}
const po = { side:THREE.DoubleSide, polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2 };
ribbon(-7, 7, 0.05, M({ color:0x2a2c33, roughness:.9, ...po }));
ribbon(-.15, .15, 0.1, new THREE.MeshBasicMaterial({ color:0xffffff, ...po }), 12);
ribbon(-9.8, -7, 0.18, M({ color:0x8a8578, roughness:.9, ...po }));
ribbon(7, 9.8, 0.18, M({ color:0x8a8578, roughness:.9, ...po }));
const SEAS = [0x6fbf5a,0x3f8a3a,0xa3823a,0xf2f6fa].map(c => new THREE.Color(c));
const seasonBlend = (arr,u,out) => { const s = clamp(u)*4, k = Math.min(3,Math.floor(s)); return out.copy(arr[k]).lerp(arr[Math.min(3,k+1)], clamp((s-k-.7)/.3)); };
const tmpC = new THREE.Color();
const gGeo = new THREE.PlaneGeometry(3000,4200,12,140), gCol = new Float32Array(gGeo.attributes.position.count*3);
for (let k=0;k<gGeo.attributes.position.count;k++){ const c = seasonBlend(SEAS, (gGeo.attributes.position.getY(k)+1200)/1400, tmpC); gCol[k*3] = c.r; gCol[k*3+1] = c.g; gCol[k*3+2] = c.b; }
gGeo.setAttribute('color', new THREE.BufferAttribute(gCol,3));
const ground = new THREE.Mesh(gGeo, M({ vertexColors:true, roughness:.95 }));
ground.rotation.x = -Math.PI/2; ground.position.set(0,-0.1,-1200); scene.add(ground);

// ---------- Fasllar va shahar ----------
const rnd = (i,k) => { const x = Math.sin(i*127.1 + k*311.7)*43758.5453; return x - Math.floor(x); };
const SKY_N = new THREE.Color(.02,.03,.07);
const SKYS = [0xa8dcff,0x62b6ff,0xf2b684,0x93a6c8].map(c => new THREE.Color(c));
const WIN_D = new THREE.Color(0x3a5a7a), WIN_N = new THREE.Color(0xffc870);
const BM = c => new THREE.MeshBasicMaterial({ color:c });
const winLit = BM(0x3a5a7a), signMat = BM(0xffb347);
const lampTex = glowTexture(g => { const r = g.createRadialGradient(128,128,0,128,128,128);
  r.addColorStop(0,'rgba(255,190,100,.9)'); r.addColorStop(1,'rgba(255,190,100,0)'); g.fillStyle = r; g.fillRect(0,0,256,256); });
const dotTex = glowTexture(g => { const r = g.createRadialGradient(128,128,0,128,128,128);
  r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(.45,'rgba(255,255,255,.85)'); r.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0,0,256,256); });
const lampSpr = new THREE.SpriteMaterial({ map:lampTex, transparent:true, opacity:0, depthWrite:false, blending:THREE.AdditiveBlending });
const poolMat = new THREE.MeshBasicMaterial({ map:lampTex, transparent:true, opacity:0, depthWrite:false, blending:THREE.AdditiveBlending, polygonOffset:true, polygonOffsetFactor:-4, polygonOffsetUnits:-4 });
const winMat = (() => {
  const cc = document.createElement('canvas'), ce = document.createElement('canvas');
  cc.width = cc.height = ce.width = ce.height = 64;
  const g1 = cc.getContext('2d'), g2 = ce.getContext('2d');
  g1.fillStyle = '#223a5e'; g1.fillRect(0,0,64,64); g2.fillStyle = '#000'; g2.fillRect(0,0,64,64);
  for (let x=0;x<2;x++) for (let y=0;y<2;y++){ const lit = Math.random()>.4;
    g1.fillStyle = lit ? '#ffd98a' : '#3d5a80'; g1.fillRect(x*32+6,y*32+6,20,20);
    if (lit){ g2.fillStyle = '#ffcf70'; g2.fillRect(x*32+6,y*32+6,20,20); } }
  const t1 = new THREE.CanvasTexture(cc), t2 = new THREE.CanvasTexture(ce);
  t1.wrapS = t1.wrapT = t2.wrapS = t2.wrapT = THREE.RepeatWrapping;
  return new THREE.MeshStandardMaterial({ map:t1, emissive:0xffffff, emissiveMap:t2, emissiveIntensity:0, roughness:.25, metalness:.4 });
})();
const doorMat = M({ color:0x5a3220 }), potMat = M({ color:0x8a4b2a }), tableMat = M({ color:0x6b4423 });
const FLS = [[0xff8fb0,0xffe066,0xffffff],[0xe63946,0xffd166,0xc77dff],[0xe8832a,0xe9b93a,0xb5451b]].map(a => a.map(c => M({ color:c, roughness:.6 })));
const awn = [tentMat, M({ color:0x2a9d8f, roughness:.5 }), M({ color:0xe9c46a, roughness:.5 })];
const umb = [M({ color:0xd62828 }), M({ color:0x2a9d8f }), M({ color:0xf4a261 })];
const snowMat = M({ color:0xffffff, roughness:.9 });
const LM = { pk1:0xffb3c7, pk2:0xff8fb0, pk3:0xf7a6c4, lg:0x86d46f, g1:0x2d6a4f, g2:0x3a8a4a, g3:0x57b06a, or:0xe8832a, rd:0xc23b22, yl:0xe9b93a };
for (const k in LM) LM[k] = M({ color:LM[k], roughness:.8 });
const gm = c => M({ color:c, roughness:1, polygonOffset:true, polygonOffsetFactor:-6, polygonOffsetUnits:-6 });
const petalG = gm(0xffc4d4), leafG = [gm(0x8fc96b), gm(0x6fb25a), gm(0xa6d77c)];
const xl = [0xff3b3b,0xffd24a,0x4aa8ff,0x5cff8a].map(c => ({ c, m:BM(c) }));
// xilma-xil uylar uchun
const cream = M({ color:0xfff3d6, roughness:.5 });
const trimM = M({ color:0x3b2a1e, roughness:.8 });
const shutC = [0x2a6f5a,0x9b3d2e,0x2f5d8a,0x6b4a2b].map(c => M({ color:c, roughness:.7 }));
const WALLS = [villageMat, ...[0xe6d8b8,0xf1ece0,0xd3a96b,0xc98b6b,0xb8c5a0,0xe8c9a0,0xa9c7d8,0xd9a5a0,0xf0dd9a,0xcfd8b0,0x9bbf9a,0xf3b6a0].map(c => M({ color:c, roughness:.9 }))];
const ROOFS = [roofMat, ...[0x8c3b2b,0x3e5c76,0x6b4f3a,0x7a2e2e,0x2f6b4f,0x9a5a2a,0x5b5f69].map(c => M({ color:c, roughness:.8 }))];
const FAC = [0xd8d2c4,0xb9c4cf,0x9fb0c2,0xc9b79c,0x8f9aa8,0xe3dccb,0xc98b6b,0xa9c7d8,0xe8c9a0,0x7f8fa0].map(c => M({ color:c, roughness:.55 }));
function mkWin(bg,dim,nx){
  const cc = document.createElement('canvas'), ce = document.createElement('canvas'); cc.width = cc.height = ce.width = ce.height = 64;
  const g1 = cc.getContext('2d'), g2 = ce.getContext('2d'); g1.fillStyle = bg; g1.fillRect(0,0,64,64); g2.fillStyle = '#000'; g2.fillRect(0,0,64,64);
  const cw = 64/nx;
  for (let x=0;x<nx;x++) for (let y=0;y<2;y++){ const lit = Math.random()>.4; g1.fillStyle = lit ? '#ffd98a' : dim; g1.fillRect(x*cw+cw*.18,y*32+7,cw*.64,18); if (lit){ g2.fillStyle = '#ffcf70'; g2.fillRect(x*cw+cw*.18,y*32+7,cw*.64,18); } }
  const t1 = new THREE.CanvasTexture(cc), t2 = new THREE.CanvasTexture(ce); t1.wrapS = t1.wrapT = t2.wrapS = t2.wrapT = THREE.RepeatWrapping;
  return new THREE.MeshStandardMaterial({ map:t1, emissive:0xffffff, emissiveMap:t2, emissiveIntensity:0, roughness:.5, metalness:.2 });
}
const WINS = [winMat, mkWin('#9a5b3c','#3d2a22',3), mkWin('#d9c7a3','#6a7a8a',2), mkWin('#e8e6df','#4a6a8a',3), mkWin('#3b4048','#555d68',2), mkWin('#2f6f73','#1f4a4d',2), mkWin('#c98b6b','#4a3a30',3), mkWin('#8fb2c9','#3a566e',1), mkWin('#b9c4cf','#44566a',2)];
const DOME = M({ color:0x2aa3b5, metalness:.3, roughness:.35 }), goldB = M({ color:0xf2c14e, metalness:.8, roughness:.3 }), redLamp = BM(0xff3030);
function dome(grp,cx,H,w,z=0){ put('cyl',cream,grp,cx,H+.8,z,w*.28,1.6,w*.28); put('sph',DOME,grp,cx,H+1.6,z,w*.32,w*.3,w*.32); put('cyl',goldB,grp,cx,H+1.6+w*.3,z,.08,1.6,.08); put('sph',goldB,grp,cx,H+2.4+w*.3,z,.25,.25,.25); }
function roofTop(grp,cx,H,w,d,kk,z=0){
  const v = kk%5;
  if (v===0){ put('cyl',poleMat,grp,cx,H+5,z,.15,10,.15); put('sph',redLamp,grp,cx,H+10,z,.35,.35,.35); }
  else if (v===1){ put('cyl',tableMat,grp,cx,H+1.4,z,1.6,2.2,1.6); put('cone',roofMat,grp,cx,H+3.1,z,1.9,1.2,1.9); }
  else if (v===2) dome(grp,cx,H,w,z);
  else if (v===3){ put('box',FAC[(kk+3)%FAC.length],grp,cx,H+1,z,w*.45,2,d*.5); put('box',trimM,grp,cx,H+2.2,z,w*.5,.3,d*.55); }
}

const pools = new Map(), mtx = new THREE.Matrix4(), qq = new THREE.Quaternion(), ee = new THREE.Euler(), v1 = new THREE.Vector3(), v2 = new THREE.Vector3();
const GEO = {
  box:() => new THREE.BoxGeometry(1,1,1), cyl:() => new THREE.CylinderGeometry(1,1,1,10),
  cone:() => { const g = new THREE.ConeGeometry(1,1,4); g.rotateY(Math.PI/4); return g; },
  sph:() => new THREE.SphereGeometry(1,8,8), pln:() => { const g = new THREE.PlaneGeometry(1,1); g.rotateX(-Math.PI/2); return g; }
};
function put(kind, mat, grp, x,y,z, sx,sy,sz, rz=0, ry=0){
  const k = kind + mat.uuid; let P = pools.get(k); if (!P){ P = { kind, mat, m:[] }; pools.set(k,P); }
  qq.setFromEuler(ee.set(0,ry,rz,'YXZ')); mtx.compose(v1.set(x,y,z), qq, v2.set(sx,sy,sz)).premultiply(grp.matrixWorld); P.m.push(mtx.clone());
}
function flush(){
  pools.forEach(P => { const im = new THREE.InstancedMesh(GEO[P.kind](), P.mat, P.m.length);
    P.m.forEach((m,j) => im.setMatrixAt(j,m)); im.frustumCulled = false; scene.add(im); });
  pools.clear();
}
function tallBox(grp,w,h,d,mat,x,y,z){
  const geo = new THREE.BoxGeometry(w,h,d), uv = geo.attributes.uv;
  for (let k=0;k<uv.count;k++) uv.setXY(k, uv.getX(k)*w/6, uv.getY(k)*h/6);
  const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); grp.add(m);
}
let CU = 0;

const PUFF = [[0,4.3,0,2.1],[1.3,3.6,.6,1.6],[-1.2,3.7,-.5,1.7],[.3,5.5,.3,1.5],[-.6,4.7,1.2,1.4],[.9,4.8,-1.1,1.4],[0,3.1,0,1.9]];
function tree(grp,x,z,u,k){
  const s = u*4, r = rnd(k,17), pinkP = s<.5 ? .7 : .7*clamp(1-(s-.5)/.5), ty = k%3, nP = ty===1 ? 6 : 7;
  const puffs = s<2.2 ? nP : Math.round(nP*clamp(1-(s-2.2)/.8)), bare = s>=3 || puffs===0, th = ty===1 ? 4 : 3.6, tw = ty===1 ? .2 : .32;
  put('cyl',trunkMat,grp,x,bare?th*.75:th/2,z,tw,bare?th*1.5:th,tw); put('sph',trunkMat,grp,x,.2,z,tw*1.8,.4,tw*1.8);
  if (bare){
    if (s>=3) put('sph',snowMat,grp,x,th*1.5,z,.5,.3,.5);
    for (let b=0;b<5;b++){ const a = b*1.26 + r*3, ca = Math.cos(a), sa = Math.sin(a);
      put('cyl',trunkMat,grp,x-.68*ca,th*1.5+.9,z+.68*sa,.1,2.4,.1,.6,a);
      if (s>=3) put('sph',snowMat,grp,x-1.36*ca,th*1.5+1.9,z+1.36*sa,.3,.25,.3); }
    return;
  }
  const pink = rnd(k,5) < .65, G = pink ? [LM.pk1,LM.pk2,LM.pk3] : [LM.g1,LM.g2,LM.g3], fol = j => G[(k+j)%3];
  for (let j=0;j<puffs;j++){ const q = PUFF[j];

      if (sh) for (let h=TR-1;h>0;h--) for (let c=0;c<3;c++) f.pos[b+h*3+c] = f.pos[b+(h-1)*3+c];
      f.pos[b] += f.vel[o]*dt; f.pos[b+1] += f.vel[o+1]*dt; f.pos[b+2] += f.vel[o+2]*dt;
      cB.setRGB(f.pc[o],f.pc[o+1],f.pc[o+2]); cTmp.lerpColors(HOT,cB,hotK).lerp(EMB,embK);
      const fade = Math.pow(1-age,.8)*(.6+.4*Math.random());
      for (let h=0;h<TR;h++){ const k = Math.pow(1-h/TR,1.7)*fade, v = b+h*3; f.col[v] = cTmp.r*k; f.col[v+1] = cTmp.g*k; f.col[v+2] = cTmp.b*k; }
    }
    f.pts.geometry.attributes.position.needsUpdate = true; f.pts.geometry.attributes.color.needsUpdate = true;
    f.fl.material.opacity = clamp(1 - f.t/.3)*fa*.9;
    if (f.t > f.life){ f.ph = 0; f.t = -Math.random()*1.2; f.pts.material.opacity = 0; f.fl.material.opacity = 0; }
  });
  if (!santaDone && !santaOn && cu > .965){ santaOn = true; santaX = 2500; santa.visible = true; }
  if (santaOn){
    santaX -= 1500*dt; santa.position.set(santaX, 720 + Math.sin(T*3)*8, -3300); santa.rotation.z = Math.sin(T*2)*.05;
    legsAnim.forEach((l,j) => l.rotation.z = Math.sin(T*10+j)*.6);
    if (santaX < -2500){ santaOn = false; santaDone = true; santa.visible = false; }
  }
}

// ---------- Skroll va animatsiya ----------
let scrollProgress = 0;
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
scrollTo(0,0);
const heroEl = document.getElementById('hero'), endEl = document.getElementById('end');
function onScroll(){ const max = document.documentElement.scrollHeight - innerHeight; scrollProgress = max > 0 ? scrollY/max : 0; }
addEventListener('scroll', onScroll); addEventListener('load', () => { scrollTo(0,0); onScroll(); }); onScroll();
let mouseX = 0, mouseY = 0;
addEventListener('mousemove', e => { mouseX = (e.clientX/innerWidth-.5)*.15; mouseY = (e.clientY/innerHeight-.5)*.1; });
let currentT = 0;
function skyPlace(obj, fwd, right, dist, side, y){
  obj.position.copy(camera.position).addScaledVector(fwd, dist).addScaledVector(right, side);
  obj.position.y = y;
}
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(.05, clock.getDelta());
  currentT += (Math.min(.999, scrollProgress) - currentT) * Math.min(1, dt*6);   // skroll qancha, kamera shuncha: oldinga ham, orqaga ham
  const p = currentT;
  heroEl.style.opacity = p > .02 ? Math.max(0, 1-(p-.02)*25) : 1; endEl.style.opacity = clamp((p-.96)*25);
  camera.position.copy(curve.getPointAt(currentT));
  const tg = camera.position.clone().addScaledVector(flatTangent(currentT), 50); tg.y += 14*clamp((currentT-.86)/.14); camera.lookAt(tg);
  camera.rotation.y += mouseX*.05; camera.rotation.x += mouseY*.05;
  const fwd = flatTangent(currentT), right = new THREE.Vector3(-fwd.z, 0, fwd.x);
  const d = clamp(p/.14)*clamp((.93-p)/.18), n = 1 - d;
  moon.visible = n > .05; moon.material.opacity = clamp(n*1.6);
  skyPlace(moon, fwd, right, 1900, p<.5 ? -400 : 400, 150 + 450*n);
  sun.visible = d > .04; sun.material.opacity = clamp(d*4);
  skyPlace(sun, fwd, right, 1900, 500 - 1000*p, 20 + 760*d);
  const sp = Math.sin(clamp(d)*Math.PI);
  shafaq.material.opacity = sp*.6;
  skyPlace(shafaq, fwd, right, 1950, 0, 230);
  shafaq.lookAt(camera.position.x, 230, camera.position.z);
  const sky = SKY_N.clone().lerp(seasonBlend(SKYS, currentT, tmpC), d); sky.r += sp*.3; sky.g += sp*.1;
  scene.background = sky; scene.fog = new THREE.FogExp2(sky, .0025);
  stars.position.copy(camera.position); stars.material.opacity = clamp(n*1.3);
  dirLight.intensity = .2 + 1.4*d; dirLight.color.copy(sunNight).lerp(sunDay, d);
  ambient.intensity = .8 + 1.1*d; ambient.color.copy(ambNight).lerp(ambDay, d);
  camLight.position.copy(camera.position); camLight.intensity = 1.8*n;
  world(dt, p, n);
  winLit.color.copy(WIN_D).lerp(WIN_N, n);
  signMat.color.setHex(0xffb347).multiplyScalar(.45 + .55*n);
  bulbMat.color.setRGB(1,.8,.47).multiplyScalar(.2 + .8*n);
  lampSpr.opacity = .7*n; poolMat.opacity = .5*n;
  WINS.forEach(m => m.emissiveIntensity = n*1.1);
  cloudMat.opacity = d*.85;
  cloudGroup.children.forEach((c,idx) => {
    const sd = idx%2===0 ? 1 : -1;
    c.position.set(camera.position.x + sd*(70+(idx%3)*30), 100 + (idx%4)*8, camera.position.z - idx*45);
  });
  renderer.render(scene, camera);
}
animate();
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
