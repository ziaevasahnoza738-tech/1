<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toshkent — Qadimdan Zamonaviylikka Sayohat</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #f3c653;
  --cream: #f9f5e8;
  --night: #050811;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 3000vh; /* Keng va bosqichma-bosqich o'zgaruvchi uzun sayohat */
  background: var(--night);
  color: var(--cream);
  font-family: 'Manrope', sans-serif;
  overflow-x: hidden;
}
#canvas-container {
  position: fixed;
  inset: 0;
  z-index: 1;
}
canvas { display: block; width: 100vw; height: 100vh; }
.ui-layer {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 40px 60px;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: auto;
}
.logo {
  font-family: 'Cinzel', serif;
  font-size: 26px;
  font-weight: 800;
  color: var(--gold);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}
nav {
  display: flex;
  gap: 40px;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
nav a {
  color: var(--cream);
  text-decoration: none;
  transition: color 0.3s;
}
nav a:hover { color: var(--gold); }
.hero {
  position: absolute;
  top: 48%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: auto;
  transition: opacity 0.6s ease;
}
.hero h1 {
  font-family: 'Cinzel', serif;
  font-size: clamp(42px, 7vw, 84px);
  font-weight: 800;
  color: var(--cream);
  line-height: 1.1;
  letter-spacing: -0.02em;
  margin-bottom: 20px;
  text-shadow: 0 10px 40px rgba(0,0,0,0.9);
}
.hero p {
  font-size: 17px;
  color: #d1c8b0;
  max-width: 550px;
  margin: 0 auto;
  line-height: 1.6;
}
.scroll-indicator {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  font-size: 11px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--gold);
}
.scroll-bar {
  width: 1px;
  height: 50px;
  background: linear-gradient(to bottom, var(--gold), transparent);
  animation: scrollAnim 2s infinite;
}
@keyframes scrollAnim {
  0% { transform: scaleY(0); transform-origin: top; }
  50% { transform: scaleY(1); transform-origin: top; }
  50.1% { transform: scaleY(1); transform-origin: bottom; }
  100% { transform: scaleY(0); transform-origin: bottom; }
}
@media (max-width: 768px) {
  .ui-layer { padding: 20px; }
  nav { display: none; }
}
</style>
</head>
<body>

<div id="canvas-container"></div>

<div class="ui-layer">
  <header>
    <div class="logo">Toshkent</div>
    <nav>
      <a href="#">Mahallalar</a>
      <a href="#">Markaz</a>
      <a href="#">Arxitektura</a>
      <a href="#">Teleminora</a>
    </nav>
  </header>

  <div class="hero" id="hero">
    <h1>Toshkent Tarixi va Katta Kelajak</h1>
    <p>Qadimiy loy uylardan boshlanib, zamonaviy megapolislarga va Toshkent teleminorasiga olib boruvchi sayohat.</p>
  </div>

  <div class="scroll-indicator">
    <span>Sayohat uchun pastga suring</span>
    <div class="scroll-bar"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();

// Kamera yuqorida, tomlardan balandda va xavfsiz
const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 2000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0x222a40, 1.5);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
dirLight.position.set(10, 30, 20);
scene.add(dirLight);

// --- OY, QUYOSH VA SHAFAQ ---
const moon = new THREE.Mesh(new THREE.SphereGeometry(3.5, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffffee }));
scene.add(moon);
moon.add(new THREE.PointLight(0xddeeff, 2, 40));

const sun = new THREE.Mesh(new THREE.SphereGeometry(4.5, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffaa00 }));
scene.add(sun);
sun.add(new THREE.PointLight(0xffdd44, 3, 60));

const shafaq = new THREE.Mesh(new THREE.PlaneGeometry(150, 50), new THREE.MeshBasicMaterial({ color: 0xff5522, transparent: true, opacity: 0.0, blending: THREE.AdditiveBlending }));
scene.add(shafaq);

// Stars
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(1000 * 3);
for (let i = 0; i < 1000 * 3; i += 3) {
  starPos[i] = (Math.random() - 0.5) * 180;
  starPos[i+1] = Math.random() * 50 + 15;
  starPos[i+2] = -Math.random() * 1200;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true, opacity: 1.0 }));
scene.add(stars);

// Clouds
const cloudGroup = new THREE.Group();
scene.add(cloudGroup);
const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffeedd, transparent: true, opacity: 0.0 });
for (let i = 0; i < 25; i++) {
  const cloud = new THREE.Mesh(new THREE.BoxGeometry(16, 3, 7), cloudMat);
  const side = i % 2 === 0 ? -1 : 1;
  cloud.position.set(side * 40, 25, -i * 50);
  cloudGroup.add(cloud);
}

// --- TOSHHKENT TELEMINORASI (Oxirgi nuqtada qad rostlaydi) ---
const towerGroup = new THREE.Group();
towerGroup.position.set(0, 0, -1150); // Sayohatning qoq oxiri
scene.add(towerGroup);

// Teleminora asosi va tanasi (Piramida va ferma qismlari)
const towerBaseMat = new THREE.MeshStandardMaterial({ color: 0x8899aa, metalness: 0.8, roughness: 0.2 });
const towerGlassMat = new THREE.MeshStandardMaterial({ color: 0x113355, metalness: 0.9, roughness: 0.1 });

const lowerTower = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 4, 35, 16), towerBaseMat);
lowerTower.position.set(0, 17.5, 0);
towerGroup.add(lowerTower);

const restaurantCabin = new THREE.Mesh(new THREE.CylinderGeometry(4, 3, 8, 16), towerGlassMat);
restaurantCabin.position.set(0, 36, 0);
towerGroup.add(restaurantCabin);

const upperSpire = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 1.2, 30, 12), towerBaseMat);
upperSpire.position.set(0, 55, 0);
towerGroup.add(upperSpire);

// Minora chirog'i
const towerLight = new THREE.PointLight(0xff0000, 4, 50);
towerLight.position.set(0, 70, 0);
towerGroup.add(towerLight);


// --- YO'L TARIXI (Loy mahallalardan keng zamonaviy shahar markaziga) ---
const pathPoints = [
  new THREE.Vector3(0, 8.5, 0),
  new THREE.Vector3(0, 9.0, -100),
  new THREE.Vector3(20, 9.5, -250),   // Mahalladan burilish
  new THREE.Vector3(-20, 10.0, -420), // Kengroq ko'chalarga o'tish
  new THREE.Vector3(0, 10.5, -600),   // Zamonaviy binolar hududi
  new THREE.Vector3(0, 11.0, -850),   // Supermarketlar va keng ko'chalar
  new THREE.Vector3(0, 11.5, -1050),  // Teleminoraga to'g'rilanish
  new THREE.Vector3(0, 12.0, -1130)   // Teleminora ro'parasida to'xtash
];
const curve = new THREE.CatmullRomCurve3(pathPoints);

// --- TEKSTURALAR: 1. Qadimiy loy-shuvoq, 2. Zamonaviy shisha va beton ---
function createMudTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 512;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#6e442d'; ctx.fillRect(0, 0, 512, 512);
  ctx.strokeStyle = '#422518'; ctx.lineWidth = 4;
  for (let i = 0; i <= 512; i += 64) {
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
  }
  return new THREE.CanvasTexture(canvas);
}

const oldMudMat = new THREE.MeshStandardMaterial({ map: createMudTexture(), roughness: 0.9 });
const modernGlassMat = new THREE.MeshStandardMaterial({ color: 0x1b263b, roughness: 0.1, metalness: 0.9 });
const modernConcreteMat = new THREE.MeshStandardMaterial({ color: 0xd8d8d8, roughness: 0.4 });
const marketMat = new THREE.MeshStandardMaterial({ color: 0x992222, roughness: 0.3 }); // Supermarket qizil/zamonaviy aksenti

const cityGroup = new THREE.Group();
scene.add(cityGroup);

const totalSegments = 140;
const lanterns = [];

for (let i = 0; i < totalSegments; i++) {
  const t = i / totalSegments;
  const pos = curve.getPoint(t);
  const tangent = curve.getTangent(t);

  const segmentGroup = new THREE.Group();
  segmentGroup.position.copy(pos);
  segmentGroup.lookAt(pos.clone().add(tangent));

  // O'tish jarayoni: Boshida kichik loy uylar, oxiriga borgani sari 4 qator baland shisha binolar va supermarketlar!
  const progressRatio = i / totalSegments; // 0 dan 1 gacha

  // Har 4 tarafdan binolar ko'rinib turishi uchun enini kengaytiramiz
  const buildingWidth = 8 + progressRatio * 6;
  const buildingHeight = (progressRatio < 0.4) ? (7 + (i % 4) * 2) : (18 + progressRatio * 35); // Oxirida ulkan binolar
  
  // Materialni asta-sekin loydan zamonaviy shishaga o'zgartiramiz
  const currentMat = progressRatio < 0.45 ? oldMudMat : (progressRatio < 0.75 ? modernConcreteMat : modernGlassMat);

  // Chap va o'ng tomonlardagi birinchi qator uylar/binolar
  const left1 = new THREE.Mesh(new THREE.BoxGeometry(buildingWidth, buildingHeight, 10), currentMat);
  const right1 = new THREE.Mesh(new THREE.BoxGeometry(buildingWidth, buildingHeight, 10), currentMat);

  left1.position.set(-14 - (progressRatio * 10), buildingHeight / 2 - 5, 0);
  right1.position.set(14 + (progressRatio * 10), buildingHeight / 2 - 5, 0);
  
  segmentGroup.add(left1);
  segmentGroup.add(right1);

  // 4 ta tomondan ko'rinib turishi uchun ORQA QATORDAAGI 2 ta qo'shimcha binolar (Siz talab qilgandek 4 ta uy uzoqlikda ko'rinib turadi)
  if (i % 2 === 0) {
    const left2 = new THREE.Mesh(new THREE.BoxGeometry(buildingWidth + 2, buildingHeight + 6, 12), currentMat);
    const right2 = new THREE.Mesh(new THREE.BoxGeometry(buildingWidth + 2, buildingHeight + 6, 12), currentMat);

    left2.position.set(-28 - (progressRatio * 12), (buildingHeight + 6) / 2 - 5, -8);
    right2.position.set(28 + (progressRatio * 12), (buildingHeight + 6) / 2 - 5, -8);

    segmentGroup.add(left2);
    segmentGroup.add(right2);
  }

  // Chiroqlar
  if (i % 2 === 0) {
    const lampL = new THREE.PointLight(progressRatio > 0.5 ? 0xffffff : 0xffaa33, 2.5, 16);
    lampL.position.set(-10, buildingHeight / 2, 0);
    segmentGroup.add(lampL); 
    lanterns.push(lampL);

    const lampR = new THREE.PointLight(progressRatio > 0.5 ? 0xffffff : 0xffaa33, 2.5, 16);
    lampR.position.set(10, buildingHeight / 2, 0);
    segmentGroup.add(lampR); 
    lanterns.push(lampR);
  }

  cityGroup.add(segmentGroup);
}

// Ground
const groundGeo = new THREE.PlaneGeometry(250, 1600);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x0a0d14, roughness: 0.95 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, -10.0, -500);
scene.add(ground);

// Scroll & Animation
let scrollProgress = 0;
window.addEventListener('scroll', () => {
  const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
  scrollProgress = window.scrollY / maxScroll;
  
  const hero = document.getElementById('hero');
  if (scrollProgress > 0.04) {
    hero.style.opacity = Math.max(0, 1 - (scrollProgress - 0.04) * 20);
  } else {
    hero.style.opacity = 1;
  }
});

let mouseX = 0, mouseY = 0;
window.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / window.innerWidth - 0.5) * 0.15;
  mouseY = (e.clientY / window.innerHeight - 0.5) * 0.1;
});

let currentT = 0;
function animate() {
  requestAnimationFrame(animate);

  const targetT = Math.min(0.999, scrollProgress);
  currentT += (targetT - currentT) * 0.03;

  const cameraPos = curve.getPoint(currentT);
  const lookAtTarget = curve.getPoint(Math.min(0.999, currentT + 0.015));

  camera.position.copy(cameraPos);
  camera.lookAt(lookAtTarget);

  camera.rotation.y += mouseX * 0.05;
  camera.rotation.x += mouseY * 0.05;

  const currentZ = camera.position.z;

  // Oy va Quyosh dinamikasi
  moon.position.set(camera.position.x - 20 + (scrollProgress * 40), camera.position.y + 14, currentZ - 40);
  moon.visible = scrollProgress < 0.6;
  moon.material.opacity = Math.max(0, 1 - scrollProgress * 1.8);

  sun.position.set(camera.position.x - 25 + ((scrollProgress - 0.3) * 50), camera.position.y + 10, currentZ - 45);
  sun.visible = scrollProgress > 0.25;
  sun.material.opacity = Math.min(1, (scrollProgress - 0.25) * 3);

  // Shafaq
  if (scrollProgress >= 0.35 && scrollProgress <= 0.8) {
    const sp = (scrollProgress - 0.35) / 0.45;
    shafaq.material.opacity = Math.sin(sp * Math.PI) * 0.6;
    shafaq.position.set(camera.position.x, camera.position.y + 6, currentZ - 50);
  } else {
    shafaq.material.opacity = 0;
  }

  // Tundan kunduzga o'tish
  const r = Math.min(1, 0.02 + scrollProgress * 0.7);
  const g = Math.min(1, 0.03 + scrollProgress * 0.85);
  const b = Math.min(1, 0.06 + scrollProgress * 0.95);
  scene.background = new THREE.Color(r, g, b);
  scene.fog = new THREE.FogExp2(new THREE.Color(r, g, b), 0.03);

  stars.material.opacity = Math.max(0, 1 - scrollProgress * 2.5);

  const lanternIntensity = Math.max(0.3, 2.5 - scrollProgress * 3);
  lanterns.forEach(l => l.intensity = lanternIntensity);

  // Bulutlar
  if (scrollProgress >= 0.45) {
    const p = (scrollProgress - 0.45) / 0.55;
    cloudMat.opacity = Math.min(0.9, p * 2);
    cloudGroup.children.forEach((cloud, idx) => {
      const side = idx % 2 === 0 ? 1 : -1;
      cloud.position.set(camera.position.x + side * (12 + (idx%3)*4), camera.position.y + 16, currentZ - (idx * 40));
    });
  } else {
    cloudMat.opacity = 0;
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
